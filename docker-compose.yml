services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WS_PORT:-8080}:${WS_PORT:-8080}"
    volumes:
      - ./pcap:/app/pcap:ro
    environment:
      PCAP_DIR: /app/pcap
      PCAP_PREFIX: "${PCAP_PREFIX:-20250331_MBO_084_EQT,20250929_MBO_072_DRV}"
      WS_PORT: "${WS_PORT:-8080}"
      REPLAY_SPEED: "${REPLAY_SPEED:-2}"
      UMDF_FIX_CONFLATED_ENABLED: "${UMDF_FIX_CONFLATED_ENABLED:-false}"
      UMDF_FIX_CONFLATED_PORT: "${UMDF_FIX_CONFLATED_PORT:-9200}"
      UMDF_FIX_CONFLATED_CONFLATION_MS: "${UMDF_FIX_CONFLATED_CONFLATION_MS:-380}"
      UMDF_FIX_CONFLATED_RESEND_BUFFER_CAPACITY: "${UMDF_FIX_CONFLATED_RESEND_BUFFER_CAPACITY:-10000}"
      UMDF_FIX_CONFLATED_OUTBOUND_QUEUE_CAPACITY: "${UMDF_FIX_CONFLATED_OUTBOUND_QUEUE_CAPACITY:-4096}"
      UMDF_FIX_CONFLATED_EVENT_QUEUE_CAPACITY: "${UMDF_FIX_CONFLATED_EVENT_QUEUE_CAPACITY:-65536}"
      UMDF_SERVER_FLUSH_WINDOW_MS: "${UMDF_SERVER_FLUSH_WINDOW_MS:-10}"
      UMDF_CONFLATED_CADENCES_MS: "${UMDF_CONFLATED_CADENCES_MS:-100,250,500}"
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
